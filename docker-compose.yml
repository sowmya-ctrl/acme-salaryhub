# One-command local run:  docker compose up --build
# Then open http://localhost:8000  and sign in with the demo login below.
#
# The credentials here are for a throwaway LOCAL demo only. For any real deployment,
# set your own JWT_SECRET and ADMIN_PASSWORD (see README) and never reuse these.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salaryhub
      POSTGRES_PASSWORD: salaryhub
      POSTGRES_DB: salaryhub
    volumes:
      - salaryhub-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salaryhub -d salaryhub"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://salaryhub:salaryhub@db:5432/salaryhub
      JWT_SECRET: local-demo-only-secret-change-for-real-use
      ADMIN_EMAIL: hr@acme.example
      ADMIN_PASSWORD: Demo-Only-Pass-123
      SEED_ON_START: "true"   # idempotent: loads 10,000 employees on first start

volumes:
  salaryhub-data:
