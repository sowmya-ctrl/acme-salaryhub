# Render blueprint: one web service (API + built UI) and a managed Postgres.
databases:
  - name: salaryhub-db
    plan: free

services:
  - type: web
    name: acme-salaryhub
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SEED_ON_START   # idempotent; loads 10,000 demo employees on first boot
        value: "true"
      - key: JWT_SECRET        # signs login tokens; generated once by Render
        generateValue: true
      - key: ADMIN_EMAIL       # first login, created on first boot
        value: hr@acme.example
      - key: ADMIN_PASSWORD    # generated by Render: read it in the service's Environment tab
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: salaryhub-db
          property: connectionString
