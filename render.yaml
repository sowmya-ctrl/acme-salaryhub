# Render blueprint: one web service (API + built UI) and a managed Postgres.
databases:
  - name: salaryhub-db
    plan: free

services:
  - type: web
    name: acme-salaryhub
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SEED_ON_START   # idempotent; loads 10,000 demo employees on first boot
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: salaryhub-db
          property: connectionString
